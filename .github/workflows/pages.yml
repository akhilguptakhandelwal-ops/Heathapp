name: Publish app

# Works with either Pages setting:
#  - Source "GitHub Actions": the deploy job publishes the site.
#  - Source "Deploy from a branch: gh-pages": the gh-pages job updates that branch.
on:
  push:
    branches: [main, claude/mobile-video-recording-editor-v4k8ae]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gh-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Push site to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-tmp
          git rm -rf --cached .github >/dev/null
          rm -rf .github
          git add -A
          git commit -m "Publish ${GITHUB_SHA::7}"
          git push -f origin gh-pages-tmp:gh-pages

  deploy:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
