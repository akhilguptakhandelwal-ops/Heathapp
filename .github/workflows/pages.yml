name: Publish app

# Works with either Pages setting:
#  - Source "GitHub Actions": the deploy job publishes the site.
#  - Source "Deploy from a branch: gh-pages": the gh-pages job updates that branch.
on:
  push:
    branches: [main, claude/mobile-video-recording-editor-v4k8ae]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gh-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Push site to gh-pages
        run: |
          node scripts/build-www.mjs
          touch www/.nojekyll
          cd www
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

  deploy:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: node scripts/build-www.mjs && touch www/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
