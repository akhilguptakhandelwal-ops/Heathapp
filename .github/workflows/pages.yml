name: Publish app to gh-pages

# Copies the app to the gh-pages branch, which GitHub Pages serves at
# https://<user>.github.io/Heathapp/
on:
  push:
    branches: [main, claude/mobile-video-recording-editor-v4k8ae]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push site to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-tmp
          git rm -rf --cached .github >/dev/null
          rm -rf .github
          git add -A
          git commit -m "Publish ${GITHUB_SHA::7}"
          git push -f origin gh-pages-tmp:gh-pages
